<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Trip - IntelliTrip</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .trip-form-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #0077b6;
            margin-bottom: 30px;
        }

        form label {
            display: block;
            margin-top: 20px;
            font-weight: 600;
        }

        form input,
        form select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .submit-btn {
            margin-top: 30px;
            padding: 12px 25px;
            background: #0077b6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
        }

        .submit-btn:hover {
            background: #023e8a;
        }
    </style>
</head>

<body>
    <div class="trip-form-container">
        <h2>Plan Your Custom Trip</h2>
        <form id="tripForm">
            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="">-- Select State --</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="West Bengal">West Bengal</option>
                <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                <option value="Delhi">Delhi</option>
                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                <option value="Ladakh">Ladakh</option>
                <option value="Lakshadweep">Lakshadweep</option>
                <option value="Puducherry">Puducherry</option>
            </select>


            <label for="placeType">Type of Place:</label>
            <select id="placeType" name="placeType">
                <option value="">-- Select Type --</option>
                <option value="Amusment Park">Amusment Park</option>
                <option value="Beach">Beach</option>
                <option value="Deserts">Deserts</option>
                <option value="Forts">Forts</option>
                <option value="Monuments">Monuments</option>
                <option value="Mountain">Mountain</option>
            </select>

            <label for="people">Number of People:</label>
            <input type="number" id="people" name="people" min="1" placeholder="Enter number of people">
            
            <label for="budget">Budget (INR):</label>
            <input type="number" id="budget" name="budget" min="1000" placeholder="Enter your budget">
            
            <label for="tripLength">Trip Length (in days):</label>
            <input type="number" id="tripLength" name="tripLength" placeholder="Enter trip length" required>


            <button type="submit" class="submit-btn">Find Trips</button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
